[project]
name = "shipyardhq"
version = "0.1.0"
description = "Shipyard HQ Django rebuild"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<6.0",
    "django-redis>=5.4,<6.0",
    "django-rq>=2.10,<4.0",
    "django-taggit>=6.1,<7.0",
    "gunicorn>=23.0,<24.0",
    "psycopg[binary]>=3.2,<4.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "shipyardhq",
    "shipyardhq.*",
    "core",
    "core.*",
    "accounts",
    "accounts.*",
    "catalog",
    "catalog.*",
    "extras",
    "extras.*",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-django>=4.9,<5.0",
    "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "shipyardhq.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501"]
