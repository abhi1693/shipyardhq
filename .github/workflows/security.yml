name: Security Checks
on:
  pull_request: null
  push:
    branches:
      - master
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}-${{ github.actor }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  security:
    uses: abhi1693/actions/.github/workflows/security.yml@34e92ba1eee6a47e9b10f13e2180114fc01b6027
    with:
      runs-on: ubuntu-24.04-arm
      node-version: "22"
      workflow-lint: false
      gitleaks-config: .gitleaks.toml
      npm-audit: true
      npm-severity: high
      npm-include-dev: false
