name: Container Image
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Semver image version without a leading v
        required: true
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}-${{ github.actor }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  images:
    uses: abhi1693/actions/.github/workflows/container-images.yml@v1
    with:
      manifest: .github/images.json
      publish: true
      # GitHub attestation storage does not support user-owned private repos.
      # BuildKit provenance, SBOM, image scanning and smoke checks stay enabled.
      attest: false
      version: ${{ inputs.version }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
