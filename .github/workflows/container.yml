name: Container Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Semver image version without a leading v
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build linux/arm64
    uses: abhi1693/actions/.github/workflows/docker-build-push.yml@master
    with:
      runs-on: home-lab-arm64
      image: ghcr.io/abhi1693/shipyardhq
      context: .
      file: Dockerfile
      platforms: linux/arm64
      cache-scope: shipyardhq-arm64
      build-args: |
        APP_VERSION=${{ github.event.release.tag_name || inputs.version }}
      tags: |
        type=semver,pattern={{version}}
        type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
      labels: |
        org.opencontainers.image.source=https://github.com/abhi1693/shipyardhq
        org.opencontainers.image.title=shipyardhq
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
