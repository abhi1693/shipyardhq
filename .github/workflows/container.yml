name: Container Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Semver image version without a leading v
        required: true

permissions:
  contents: read

env:
  REGISTRY: registry.abhimanyu-saharan.com
  IMAGE_NAME: shipyardhq/shipyardhq

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Write production env file
        env:
          CACHE_ENV_PREFIX: ${{ secrets.CACHE_ENV_PREFIX }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          DODO_API_KEY: ${{ secrets.DODO_API_KEY }}
          DODO_ENV: ${{ secrets.DODO_ENV }}
          DODO_WEBHOOK_SECRET: ${{ secrets.DODO_WEBHOOK_SECRET }}
          GA_CREDENTIALS_JSON: ${{ secrets.GA_CREDENTIALS_JSON }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GOOGLE_ANALYTICS_API_SECRET: ${{ secrets.GOOGLE_ANALYTICS_API_SECRET }}
          GOOGLE_ANALYTICS_ID: ${{ secrets.GOOGLE_ANALYTICS_ID }}
          MONTHLY_WINNER_PLAN_SLUG: ${{ secrets.MONTHLY_WINNER_PLAN_SLUG }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_CLARITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_CLARITY_PROJECT_ID }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}
          NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL }}
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_UP_URL }}
          NEXT_TELEMETRY_DISABLED: ${{ secrets.NEXT_TELEMETRY_DISABLED }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PRISMA_GENERATE_NO_ENGINE: ${{ secrets.PRISMA_GENERATE_NO_ENGINE }}
          PRODUCT_HUNT_APP_ID: ${{ secrets.PRODUCT_HUNT_APP_ID }}
          PRODUCT_HUNT_INDEX_NAME: ${{ secrets.PRODUCT_HUNT_INDEX_NAME }}
          PRODUCT_HUNT_SEARCH_KEY: ${{ secrets.PRODUCT_HUNT_SEARCH_KEY }}
          REDDIT_BOT_SUBREDDIT: ${{ secrets.REDDIT_BOT_SUBREDDIT }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const keys = [
            "CACHE_ENV_PREFIX",
            "CLERK_SECRET_KEY",
            "CLERK_WEBHOOK_SIGNING_SECRET",
            "DODO_API_KEY",
            "DODO_ENV",
            "DODO_WEBHOOK_SECRET",
            "GA_CREDENTIALS_JSON",
            "GA_PROPERTY_ID",
            "GOOGLE_ANALYTICS_API_SECRET",
            "GOOGLE_ANALYTICS_ID",
            "MONTHLY_WINNER_PLAN_SLUG",
            "NEXT_PUBLIC_APP_URL",
            "NEXT_PUBLIC_CLARITY_PROJECT_ID",
            "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY",
            "NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL",
            "NEXT_PUBLIC_CLERK_SIGN_IN_URL",
            "NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL",
            "NEXT_PUBLIC_CLERK_SIGN_UP_URL",
            "NEXT_TELEMETRY_DISABLED",
            "OPENAI_API_KEY",
            "PRISMA_GENERATE_NO_ENGINE",
            "PRODUCT_HUNT_APP_ID",
            "PRODUCT_HUNT_INDEX_NAME",
            "PRODUCT_HUNT_SEARCH_KEY",
            "REDDIT_BOT_SUBREDDIT",
            "REDDIT_CLIENT_ID",
            "REDDIT_CLIENT_SECRET",
            "REDIS_URL",
          ];

          const lines = keys
            .filter((key) => process.env[key] !== undefined)
            .map((key) => `${key}=${JSON.stringify(process.env[key])}`);

          fs.writeFileSync(".env.production.local", `${lines.join("\n")}\n`, { mode: 0o600 });
          NODE

      - name: Log in to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}-${{ matrix.suffix }},enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ inputs.version }}-${{ matrix.suffix }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest-${{ matrix.suffix }}

      - name: Build image archive
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            NODE_IMAGE=${{ env.REGISTRY }}/docker.io/library/node:22.21.1-bookworm-slim
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=oci,dest=${{ runner.temp }}/shipyardhq-${{ matrix.suffix }}.oci.tar
          secret-files: |
            build_env=.env.production.local

      - name: Publish with regctl
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_ARCHIVE: ${{ runner.temp }}/shipyardhq-${{ matrix.suffix }}.oci.tar
          REGISTRY_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail
          regctl_config="${RUNNER_TEMP}/regctl"
          mkdir -p "${regctl_config}"
          chmod 0777 "${regctl_config}"
          printf '%s' "${REGISTRY_PASSWORD}" \
            | docker run --rm -i \
                -e REGCTL_CONFIG=/config/config.json \
                -v "${regctl_config}:/config" \
                regclient/regctl:latest \
                registry login "${REGISTRY}" -u "${REGISTRY_USERNAME}" --pass-stdin
          docker run --rm \
            -e REGCTL_CONFIG=/config/config.json \
            -v "${regctl_config}:/config" \
            regclient/regctl:latest \
            registry set "${REGISTRY}" --blob-chunk 10485760 --blob-max 1
          while IFS= read -r image_tag; do
            [ -n "${image_tag}" ] || continue
            for attempt in 1 2 3; do
              docker run --rm \
                -e REGCTL_CONFIG=/config/config.json \
                -v "${regctl_config}:/config" \
                -v "${RUNNER_TEMP}:${RUNNER_TEMP}" \
                regclient/regctl:latest \
                image import "${image_tag}" "${IMAGE_ARCHIVE}" -v info && break
              if [ "${attempt}" -eq 3 ]; then
                exit 1
              fi
              sleep $((attempt * 15))
            done
          done <<< "${IMAGE_TAGS}"

  manifest:
    name: Publish manifest
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish multi-arch manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          version="${RELEASE_TAG#v}"
          docker buildx imagetools create \
            -t "${IMAGE}:${version}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${version}-amd64" \
            "${IMAGE}:${version}-arm64"
