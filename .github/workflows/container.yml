name: Container Image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build arm64 image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Write production env file
        env:
          CACHE_ENV_PREFIX: ${{ secrets.CACHE_ENV_PREFIX }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          DODO_API_KEY: ${{ secrets.DODO_API_KEY }}
          DODO_ENV: ${{ secrets.DODO_ENV }}
          DODO_WEBHOOK_SECRET: ${{ secrets.DODO_WEBHOOK_SECRET }}
          GA_CREDENTIALS_JSON: ${{ secrets.GA_CREDENTIALS_JSON }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GOOGLE_ANALYTICS_API_SECRET: ${{ secrets.GOOGLE_ANALYTICS_API_SECRET }}
          GOOGLE_ANALYTICS_ID: ${{ secrets.GOOGLE_ANALYTICS_ID }}
          MONTHLY_WINNER_PLAN_SLUG: ${{ secrets.MONTHLY_WINNER_PLAN_SLUG }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_CLARITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_CLARITY_PROJECT_ID }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}
          NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL }}
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_UP_URL }}
          NEXT_TELEMETRY_DISABLED: ${{ secrets.NEXT_TELEMETRY_DISABLED }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PRISMA_GENERATE_NO_ENGINE: ${{ secrets.PRISMA_GENERATE_NO_ENGINE }}
          PRODUCT_HUNT_APP_ID: ${{ secrets.PRODUCT_HUNT_APP_ID }}
          PRODUCT_HUNT_INDEX_NAME: ${{ secrets.PRODUCT_HUNT_INDEX_NAME }}
          PRODUCT_HUNT_SEARCH_KEY: ${{ secrets.PRODUCT_HUNT_SEARCH_KEY }}
          REDDIT_BOT_SUBREDDIT: ${{ secrets.REDDIT_BOT_SUBREDDIT }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const keys = [
            "CACHE_ENV_PREFIX",
            "CLERK_SECRET_KEY",
            "CLERK_WEBHOOK_SIGNING_SECRET",
            "DODO_API_KEY",
            "DODO_ENV",
            "DODO_WEBHOOK_SECRET",
            "GA_CREDENTIALS_JSON",
            "GA_PROPERTY_ID",
            "GOOGLE_ANALYTICS_API_SECRET",
            "GOOGLE_ANALYTICS_ID",
            "MONTHLY_WINNER_PLAN_SLUG",
            "NEXT_PUBLIC_APP_URL",
            "NEXT_PUBLIC_CLARITY_PROJECT_ID",
            "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY",
            "NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL",
            "NEXT_PUBLIC_CLERK_SIGN_IN_URL",
            "NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL",
            "NEXT_PUBLIC_CLERK_SIGN_UP_URL",
            "NEXT_TELEMETRY_DISABLED",
            "OPENAI_API_KEY",
            "PRISMA_GENERATE_NO_ENGINE",
            "PRODUCT_HUNT_APP_ID",
            "PRODUCT_HUNT_INDEX_NAME",
            "PRODUCT_HUNT_SEARCH_KEY",
            "REDDIT_BOT_SUBREDDIT",
            "REDDIT_CLIENT_ID",
            "REDDIT_CLIENT_SECRET",
            "REDIS_URL",
          ];

          const lines = keys
            .filter((key) => process.env[key] !== undefined)
            .map((key) => `${key}=${JSON.stringify(process.env[key])}`);

          fs.writeFileSync(".env.production.local", `${lines.join("\n")}\n`, { mode: 0o600 });
          NODE

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secret-files: |
            build_env=.env.production.local
