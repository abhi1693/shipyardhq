name: Tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install deps (ignore scripts)
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Run tests
        run: npm run test:ci
