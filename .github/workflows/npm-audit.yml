name: npm audit (scheduled)

on:
  workflow_dispatch:
  schedule:
    - cron: '31 2 * * 1' # weekly

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: npm audit (high+; omit dev)
        run: npm audit --audit-level=high --omit=dev
