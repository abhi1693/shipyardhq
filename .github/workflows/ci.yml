name: CI

on:
  push: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies (no postinstall)
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client (no engine)
        run: npx prisma generate --no-engine

      - name: Prettier check
        run: npx prettier --check .

      - name: ESLint
        run: npm run lint

  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      matrix:
        node: [22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies (no postinstall)
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client (no engine)
        run: npx prisma generate --no-engine

      - name: Run tests (vitest)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel env pull --yes --environment=preview .env.local --token "$VERCEL_TOKEN"
          npm run prisma:init
          npm run test
