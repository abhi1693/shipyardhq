name: Dependency Audit (PR)

on:
  pull_request:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install deps
        run: npm ci --ignore-scripts

      - name: npm audit (high+; omit dev)
        run: npm audit --audit-level=high --omit=dev
