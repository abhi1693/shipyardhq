<label class="ui-field{% if extra_class %} {{ extra_class }}{% endif %}">
  <span>{{ label }}</span>
  <input class="ui-input" type="{{ input_type|default:'text' }}" name="{{ name }}"{% if value %} value="{{ value }}"{% endif %}{% if placeholder %} placeholder="{{ placeholder }}"{% endif %}{% if required %} required{% endif %}>
</label>
