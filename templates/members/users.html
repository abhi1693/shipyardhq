{% extends "members/base.html" %}
{% load django_tables2 %}

{% block member_header %}
  <header class="member-topbar">
    {% include "components/ui/breadcrumb.html" %}
    <span class="member-dashboard-auth" data-clerk-auth></span>
  </header>
{% endblock %}

{% block member_content %}
  <div class="member-list-page">
    <header class="member-list-heading">
      <h1>Users</h1>
      <span>{{ member_user_count }} user{{ member_user_count|pluralize }}</span>
    </header>

    <section class="member-table-panel">
      {% render_table table %}
    </section>
  </div>
{% endblock %}
