{% extends base_template|default:"base/private.html" %}

{% block content %}
  <section class="card">
    {% if section_eyebrow %}
      <div class="eyebrow">{{ section_eyebrow }}</div>
    {% endif %}
    <h1>{{ page_title }}</h1>
    <p>This action will permanently remove <strong>{{ object }}</strong>.</p>
    <form method="post" class="page-actions">
      {% csrf_token %}
      <button type="submit" class="button danger">Delete</button>
    </form>
  </section>
{% endblock %}
