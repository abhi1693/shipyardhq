{% extends base_template|default:"base/private.html" %}

{% block content %}
  <section class="card">
    {% if section_eyebrow %}
      <div class="eyebrow">{{ section_eyebrow }}</div>
    {% endif %}
    <h1>{{ page_title }}</h1>
    {% if page_description %}
      <p>{{ page_description }}</p>
    {% endif %}
    <form method="post" class="stack">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="page-actions">
        <button type="submit" class="button">Save</button>
      </div>
    </form>
  </section>
{% endblock %}
