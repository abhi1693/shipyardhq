{% extends "base/base.html" %}

{% block body %}
  <header class="public-header">
    <div class="container">
      <div class="row" style="padding: 18px 0;">
        <div>
          <a href="{% url 'public:home' %}" class="brand">{{ shipyard_ui.app_name }}</a>
          <div class="tagline">{{ shipyard_ui.tagline }}</div>
        </div>
        <nav class="nav-inline">
          <a href="{% url 'public:browse' %}">Browse</a>
          <a href="{% url 'public:leaderboard' %}">Leaderboard</a>
          <a href="{% url 'public:analytics' %}">Analytics</a>
          <a href="{% url 'public:pricing' %}">Pricing</a>
          {% if request.user.is_authenticated %}
            <a href="{% url 'member:overview' %}">Member area</a>
          {% else %}
            <a href="{% url 'login' %}">Sign in</a>
          {% endif %}
        </nav>
      </div>
    </div>
  </header>
  <main class="content">
    <div class="container stack">
      {% block content %}{% endblock %}
    </div>
  </main>
{% endblock %}
