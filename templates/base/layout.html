{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Shipyard HQ{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'shipyardhq/css/app.css' %}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{% url 'home' %}">Shipyard HQ</a>
      <nav class="nav" aria-label="Primary navigation">
        <span class="auth-slot" data-clerk-auth></span>
      </nav>
    </header>
    <main class="page">
      {% block content %}{% endblock %}
    </main>
    <script defer crossorigin="anonymous" src="https://{{ clerk.frontend_api_url }}/npm/@clerk/ui@1/dist/ui.browser.js"></script>
    <script defer crossorigin="anonymous" data-clerk-publishable-key="{{ clerk.publishable_key }}" src="https://{{ clerk.frontend_api_url }}/npm/@clerk/clerk-js@6/dist/clerk.browser.js"></script>
    <script defer src="{% static 'shipyardhq/js/clerk.js' %}"></script>
  </body>
</html>
